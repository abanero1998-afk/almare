<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I tuoi ordini — Almarè Boutique</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="extra.css">
  <style>
    .orders-page{max-width:800px;margin:0 auto;padding:120px 24px 80px}
    .orders-page h1{font-family:var(--font-display);font-size:2rem;font-weight:400;margin-bottom:12px}
    .orders-page .lead{color:var(--text-soft);margin-bottom:28px}
    .lookup{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px}
    .lookup input{flex:1;min-width:200px;padding:12px 14px;border-radius:12px;border:1px solid var(--glass-border);font-family:inherit}
    .order-card{padding:20px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass);margin-bottom:16px}
    .order-card h3{font-size:1rem;margin-bottom:8px}
    .order-card .meta{font-size:.85rem;color:var(--text-soft);margin-bottom:10px}
    .order-card ul{padding-left:18px;font-size:.9rem;color:var(--text-soft)}
    .status{display:inline-block;padding:4px 10px;border-radius:50px;background:var(--beige-100);font-size:.75rem;text-transform:uppercase}
  </style>
</head>
<body>
  <header class="header scrolled">
    <div class="header-inner">
      <a href="index.html" class="logo logo-text">Almarè Boutique</a>
      <nav class="nav-desktop">
        <a href="products.html">Shop</a>
        <a href="products.html?gender=bambina">Bambina</a>
        <a href="products.html?gender=bambino">Bambino</a>
        <a href="orders.html">I tuoi ordini</a>
      </nav>
      <div class="header-actions"><a href="cart.html" class="icon-btn cart-btn"><span class="cart-count">0</span></a></div>
    </div>
  </header>
  <div class="orders-page">
    <h1>I tuoi ordini</h1>
    <p class="lead">Inserisci l’email usata al checkout per vedere gli ordini.</p>
    <div class="lookup">
      <input type="email" id="emailLookup" placeholder="tua@email.com">
      <button type="button" class="btn btn-primary" id="lookupBtn">Cerca</button>
    </div>
    <div id="ordersList"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="db.js"></script>
  <script src="cart.js"></script>
  <script>
    async function load(email){
      const list=document.getElementById('ordersList');
      list.innerHTML='<p style="color:var(--text-soft)">Caricamento…</p>';
      const orders=await getMyOrders(email);
      if(!orders.length){list.innerHTML='<p style="color:var(--text-soft)">Nessun ordine trovato.</p>';return;}
      list.innerHTML=orders.map(o=>{
        const items=Array.isArray(o.items)?o.items:[];
        const date=o.created_at?new Date(o.created_at).toLocaleString('it-IT'):'';
        return `<div class="order-card"><h3>Ordine ${String(o.id).slice(0,8)}… <span class="status">${o.status||'pending'}</span></h3><p class="meta">${date} · € ${Number(o.total||0).toFixed(0)} · ${o.customer_name||''}</p><ul>${items.map(i=>`<li>${i.name} ${i.size||''} ${i.color||''} ×${i.qty||1}</li>`).join('')}</ul></div>`;
      }).join('');
    }
    lookupBtn.onclick=()=>{const email=emailLookup.value.trim();if(!email){alert('Inserisci email');return;}localStorage.setItem('almare_last_email',email);load(email);};
    const saved=localStorage.getItem('almare_last_email');if(saved){emailLookup.value=saved;load(saved);}
  </script>
</body>
</html>
