<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prodotto — Almarè Boutique</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="extra.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
.pd{max-width:1100px;margin:0 auto;padding:120px 24px 80px;display:grid;grid-template-columns:1fr 1fr;gap:48px}
.pd-img{border-radius:20px;overflow:hidden;aspect-ratio:3/4;background:#f5f0e8}
.pd-img img{width:100%;height:100%;object-fit:cover}
.pd-name{font-family:Cormorant Garamond,serif;font-size:2rem;font-weight:400;margin:8px 0}
.pd-price{font-size:1.3rem;margin-bottom:16px}
.pd-opt{padding:10px 16px;border-radius:50px;border:1px solid #e8dfd0;margin:4px;cursor:pointer;background:#fffcf7}
.pd-opt.active{background:#9a7349;color:#fff}
@media(max-width:768px){.pd{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header scrolled"><div class="header-inner">
<a href="index.html" class="logo logo-text">Almarè Boutique</a>
<nav class="nav-desktop">
<a href="products.html">Shop</a>
<a href="products.html?gender=bambina">Bambina</a>
<a href="products.html?gender=bambino">Bambino</a>
<a href="orders.html">I tuoi ordini</a>
</nav>
<a href="cart.html" class="icon-btn cart-btn"><span class="cart-count">0</span></a>
</div></header>
<main class="pd" id="productMain">Caricamento…</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="db.js"></script>
<script src="cart.js"></script>
<script>
(async function(){
  const id=new URLSearchParams(location.search).get('id');
  const catalog=await getCatalog();
  const p=catalog.products.find(x=>x.id===id);
  const main=document.getElementById('productMain');
  if(!p){main.innerHTML='Prodotto non trovato';return;}
  const sizes=p.sizes||[],colors=p.colors||[];
  main.innerHTML=`<div class="pd-img"><img src="${p.image}" alt=""></div><div>
  <p style="color:#9a7349;font-size:.75rem;text-transform:uppercase">${p.category||''}</p>
  <h1 class="pd-name">${p.name}</h1>
  <p class="pd-price">€ ${Number(p.price).toFixed(0)}</p>
  <p style="color:#5c5346;margin-bottom:20px">Tessuti selezionati, vestibilità studiata.</p>
  ${sizes.length?`<div style="margin-bottom:12px">${sizes.map((s,i)=>`<button type="button" class="pd-opt${i===0?' active':''}" data-size="${s}">${s}</button>`).join('')}</div>`:''}
  ${colors.length?`<div style="margin-bottom:20px">${colors.map((c,i)=>`<button type="button" class="pd-opt${i===0?' active':''}" data-color="${c}">${c}</button>`).join('')}</div>`:''}
  <button type="button" class="btn btn-primary" id="addBtn">Aggiungi al carrello</button>
  <a href="cart.html" class="btn btn-ghost" style="margin-left:8px">Carrello</a>
  </div>`;
  document.querySelectorAll('.pd-opt').forEach(btn=>btn.onclick=()=>{const g=btn.dataset.size?'[data-size]':'[data-color]';document.querySelectorAll('.pd-opt'+g.replace('data-','[data-').replace(']',']')).forEach(b=>b.classList.remove('active'));btn.classList.add('active');});
  // simpler toggle
  document.querySelectorAll('[data-size]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-size]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');});
  document.querySelectorAll('[data-color]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-color]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');});
  document.getElementById('addBtn').onclick=()=>{
    AlmareCart.add({id:p.id,name:p.name,price:p.price,image:p.image,size:document.querySelector('[data-size].active')?.dataset.size||'',color:document.querySelector('[data-color].active')?.dataset.color||'',qty:1});
    addBtn.textContent='✓ Aggiunto';setTimeout(()=>addBtn.textContent='Aggiungi al carrello',1500);
  };
})();
</script>
</body>
</html>
